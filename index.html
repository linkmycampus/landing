<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>LinkMyCampus | Planet Campus, the social app for Nigerian students</title>
    <meta
      name="description"
      content="LinkMyCampus is the social app for university, polytechnic and college students in Nigeria. Campus feed, chat, Pages, events and reels in one place. Live more. Connect more."
    />
    <meta
      name="keywords"
      content="LinkMyCampus, Planet Campus, campus social app, student app Nigeria, university app Nigeria, polytechnic, college, campus events, student communities, campus feed, UNILAG, OAU, UNN, UI, ABU, UNIBEN, LASU, FUTA"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="LinkMyCampus" />
    <meta name="application-name" content="LinkMyCampus" />
    <meta name="theme-color" content="#35167f" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://www.linkmycampus.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkMyCampus" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://www.linkmycampus.com/" />
    <meta property="og:title" content="LinkMyCampus | Planet Campus, the social app for Nigerian students" />
    <meta
      property="og:description"
      content="Your whole campus, in one app. Feed, chat, Pages, events and reels for students at Nigerian universities, polytechnics and colleges."
    />
    <meta property="og:image" content="https://www.linkmycampus.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LinkMyCampus: your whole campus, in one app." />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkMyCampus | Planet Campus, the social app for Nigerian students" />
    <meta
      name="twitter:description"
      content="Your whole campus, in one app. Feed, chat, Pages, events and reels for students across Nigeria."
    />
    <meta name="twitter:image" content="https://www.linkmycampus.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="LinkMyCampus: your whole campus, in one app." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!-- Structured data for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.linkmycampus.com/#organization",
            "name": "LinkMyCampus",
            "alternateName": ["LMC", "Planet Campus"],
            "url": "https://www.linkmycampus.com/",
            "logo": "https://www.linkmycampus.com/favicon.png",
            "slogan": "Live more. Connect more.",
            "description": "The digital home of Planet Campus: one place for Nigerian students to discover what's happening, find events, meet people and join communities.",
            "email": "hello@linkmycampus.com",
            "areaServed": { "@type": "Country", "name": "Nigeria" },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@linkmycampus.com",
              "areaServed": "NG",
              "availableLanguage": "English"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.linkmycampus.com/#website",
            "url": "https://www.linkmycampus.com/",
            "name": "LinkMyCampus",
            "inLanguage": "en-NG",
            "publisher": { "@id": "https://www.linkmycampus.com/#organization" }
          },
          {
            "@type": "MobileApplication",
            "name": "LinkMyCampus",
            "operatingSystem": "Android, iOS",
            "applicationCategory": "SocialNetworkingApplication",
            "description": "Campus feed, chat, Pages, events and reels for university, polytechnic and college students in Nigeria.",
            "publisher": { "@id": "https://www.linkmycampus.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
